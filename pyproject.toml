[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paywithextend"
description = "Python client for the Extend API"
readme = "README.md"
authors = [{ name = "Extend Engineering", email = "support@paywithextend.com" }]
dynamic = ["version"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
]

[project.urls]
"Issue Tracker" = "https://github.com/paywithextend/extend-python/issues"
"Source Code" = "https://github.com/paywithextend/extend-python"

[tool.hatch.version]
path = "extend/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["extend"]

[tool.hatch.build]
packages = ["extend"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "ruff>=0.15,<1",
    "pytest>=8.2,<10",
    "pytest-asyncio>=1.0,<2",
]
notebooks = ["jupyter>=1.0.0", "ipykernel>=6.0.0", "notebook>=7.0.0", "python-dotenv>=1.2.2,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: marks tests as integration tests"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]

[tool.isort]
profile = "black"
multi_line_output = 3
