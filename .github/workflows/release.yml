name: Publish reviewed SDK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-release-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Select the version from the merged commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName > /tmp/releases.json
          python - <<'PYTHON'
          import ast, json, os, pathlib, re, subprocess
          version = ast.literal_eval(ast.parse(pathlib.Path('extend/__version__.py').read_text()).body[0].value)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a stable semantic version')
          tag = 'v' + version
          released = any(item['tagName'] == tag for item in json.loads(pathlib.Path('/tmp/releases.json').read_text()))
          if not released:
              existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
              if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
                  raise SystemExit('Release tag already points to another commit; do not reuse versions')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\npublish={str(not released).lower()}\n')
          PYTHON
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest==9.2.0 pytest-asyncio==1.4.1 ruff==0.17.3 build==1.6.1
      - run: python -m ruff check extend tests tools
      - run: python -m pytest -q
      - run: python -m build
      - name: Validate the built wheel and its runtime graph
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python -m venv /tmp/release-wheel
          /tmp/release-wheel/bin/python -m pip install -c requirements.lock dist/*.whl pytest==9.2.0 pytest-asyncio==1.4.1
          /tmp/release-wheel/bin/python -I -c "import extend,os; assert 'v'+extend.__version__ == os.environ['RELEASE_TAG']"
          /tmp/release-wheel/bin/python tools/test_installed_wheel.py
          python -m venv /tmp/release-runtime
          /tmp/release-runtime/bin/python -m pip install -c requirements.lock dist/*.whl
          /tmp/release-runtime/bin/python tools/check_advisories.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the version tag and GitHub release after publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
